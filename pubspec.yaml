name: abs_stream
description: A professional task manager built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1        # لإدارة الحالة
  font_awesome_flutter: ^10.7.0   # لأيقونات المنصات
  google_fonts: ^6.2.1            # للخطوط العربية
  clipboard: ^0.1.3               # للصق الروابط
  yt_downloader: ^0.1.0           # لتحميل الفيديوهات
  path_provider: ^2.1.2           # للوصول لمسارات التخزين
  path: ^1.9.0                    # للتعامل مع مسارات الملفات